// ================= 頁面：追蹤清單（週會 Task & Issue Tracker） =================
const TF = { status:"open", owner:"", project:"all", q:"", group:"owner", kind:"", sev:"", od:"" };
const weekAgo = () => iso(addD(TODAY,-7));
const updatedThisWeek = i => (i.log||[]).some(l=>l.at && l.at >= weekAgo());
function viewTracker(){
  const all = DB.issues;
  const inStatus = i => TF.status==="all" ? true : TF.status==="open" ? isOpen(i) : (!isOpen(i) && i.closed && i.closed >= weekAgo());
  const list = all.filter(i => inStatus(i)
    && (!TF.owner || (i.owner||"（未指派）")===TF.owner)
    && (TF.project==="all" || (i.project||"")===TF.project)
    && (!TF.kind || kindOf(i)===TF.kind)
    && (!TF.sev || i.severity===TF.sev)
    && (!TF.od || (TF.od==="od" ? overdue(i) : TF.od==="tbd" ? (!i.due && isOpen(i)) : updatedThisWeek(i)))
    && has(TF.q, issueText(i)));
  const open = all.filter(isOpen);
  const owners = [...new Set(open.map(i=>i.owner||"（未指派）"))].sort((a,b)=>{ const pa=personOf(a), pb=personOf(b); return (pa&&pb)?byRank(pa,pb):(pa?-1:pb?1:0); });
  const label = n => { const p = personOf(n); return p?.enName ? `${n} ${p.enName.split(" ")[0]}` : n; };
  const groups = {};
  list.forEach(i => { const k = TF.group==="owner" ? (i.owner||"（未指派）") : (i.project||""); (groups[k] ||= []).push(i); });
  const keys = Object.keys(groups).sort((a,b)=>{ if (TF.group==="owner") { const pa=personOf(a), pb=personOf(b); return (pa&&pb)?byRank(pa,pb):(pa?-1:pb?1:0); } return (a===""?1:b===""?-1:a.localeCompare(b)); });
  let no = 0;
  const row = i => { no++; const logs = (i.log||[]); const lastDated = logs.map(l=>!!l.at).lastIndexOf(true);
    const datedN = logs.filter(l=>l.at).length; const start = datedN > 3 ? logs.findIndex((l,ix)=>l.at && logs.slice(ix).filter(x=>x.at).length<=3) : 0;
    const shown = logs.slice(start).map((l,k)=>({...l, last: start+k===lastDated})); const more = start; const od = overdue(i);
    return `<tr class="${isOpen(i)?"":"gone"} ${od?"od-row":""}">
      <td class="n">${no}<div class="iss-no">${esc(i.id)}</div></td>
      <td class="wide"><b>${esc(i.title)}</b>${updatedThisWeek(i)&&isOpen(i)?' <span class="chip acc">本週更新</span>':""}
        <div class="tk-meta"><span class="tag">${esc(i.project?proj(i.project).name:"處內事務")}</span>${i.task?' <span class="chip">工序</span>':""}${i.note?` <span class="sub">備註：${esc(i.note)}</span>`:""}</div></td>
      <td class="nowrap">${i.opened?ymd(i.opened):"—"}</td>
      <td class="nowrap">${i.due?`${ymd(i.due)}${od?'<div><span class="chip crit">逾期</span></div>':""}`:(i.dueTBD?'<span class="chip warn">TBD</span>':"—")}</td>
      <td class="tk-log">${more>0?`<div class="sub">⋯ 更早 ${more} 筆</div>`:""}${shown.map(l=>`<div class="${l.last?"last":""}">${l.at?`<b class="num">${md(l.at)}</b> `:'<span class="nodate">・</span>'}${esc(l.text).replace(/\n/g,"<br>")}</div>`).join("") || '<span class="sub">尚無進度</span>'}</td>
      <td class="nowrap">${isOpen(i)?`<span class="chip ${STC[i.status]}">${esc(i.status)}</span>`:`<span class="chip done">✓ 已結案</span><div class="sub num">${i.closed?ymd(i.closed):""}</div>`}</td>
      <td class="nowrap">${esc(i.owner?label(i.owner):(i.party||"未指派"))}</td>
      <td class="nowrap"><span class="act col"><button class="editbtn" data-quick="${i.id}">✎ 更新對策</button><button class="linkbtn" data-issue="${i.id}">編輯</button>${isOpen(i)?`<button class="linkbtn" data-close-issue="${i.id}">結案</button>`:`<button class="linkbtn" data-reopen="${i.id}">重開</button>`}</span></td></tr>`; };
  const odN = open.filter(overdue).length, wkN = open.filter(updatedThisWeek).length, clN = all.filter(i=>!isOpen(i) && i.closed && i.closed>=weekAgo()).length;
  return `<section class="sum">

// 計畫（預計）天數與實際天數：派遣與現場到崗共用
function dayInfo(boxId, psS, peS, asS, aeS, w, out){
  const ps=P(psS), pe=P(peS), as_=P(asS), ae=P(aeS);
  if (ps && pe && pe<ps) out.push(["crit",`${w.plan}${w.back}早於${w.plan}${w.go}`]);
  if (as_ && ae && ae<as_) out.push(["crit",`實際${w.back}早於實際${w.go}`]);
  const pd = ps && pe && pe>=ps ? days(ps,pe) : null, ad = as_ && ae && ae>=as_ ? days(as_,ae) : null;
  const lines = [`${w.plan}：${pd!=null?`${pd} 天（${md(iso(ps))}–${md(iso(pe))}）`:(ps?`${md(iso(ps))} ${w.go}，${w.back}日未定`:"未填完整")}`];
  if (ad!=null) lines.push(`實際：${ad} 天（${md(iso(as_))}–${md(iso(ae))}）${pd!=null&&ad!==pd?`，比${w.plan}${ad>pd?"多":"少"} ${Math.abs(ad-pd)} 天`:""}`);
  else if (as_) lines.push(`實際：${md(iso(as_))} ${w.go}，${as_<=TODAY?`目前第 ${days(as_,TODAY)} 天（${w.back}日未填）`:"（日期在今天之後，請確認）"}`);
  else lines.push("實際：尚未填寫");
  $(boxId).innerHTML = (ps || as_) ? `<div class="check ${ad!=null&&pd!=null&&ad!==pd?"warn":"ok"}">${lines.map(esc).join("<br>")}</div>` : "";
}

}

// ---------- 對策與進度：逐筆修改／刪除（編輯抽屜與更新對策抽屜共用） ----------
function logEditor(src){
  const draft = (src||[]).map(l=>({...l}));
  let editing = -1, dirty = false, boxId = "";
  const box = () => $(boxId);
  function render_(){
    const el = box(); if (!el) return;
    el.innerHTML = draft.map((l,ix)=> ix===editing
      ? `<div class="hl editing"><div class="hl-row">${inp("hlDate",l.at||"",'type="date" aria-label="日期"')}<span class="help">日期可留空（條列項目）</span></div>
          <textarea id="hlText" aria-label="進度內容">${esc(l.text)}</textarea>
          <div class="hl-act"><button type="button" class="btn sm" data-hl="ok">完成</button><button type="button" class="btn sm ghost" data-hl="cancel">取消</button><span style="flex:1"></span><button type="button" class="linkbtn warnbtn" data-hl="del">刪除這筆</button></div></div>`
      : `<div class="hl"><div class="hl-txt">${l.at?`<b class="num">${ymd(l.at)}</b>　`:'<span class="nodate">・</span>'}${esc(l.text).replace(/\n/g,"<br>")}${l.edited?' <span class="chip">已修改</span>':""}</div>
          <button type="button" class="hl-edit" data-hl="edit" data-ix="${ix}" aria-label="修改這筆進度" ${editing>=0?"disabled":""}>✎</button></div>`).join("")
      || '<div class="sub">尚無紀錄</div>';
    if (editing>=0) setTimeout(()=>{ const t=$("hlText"); if (t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } },20);
  }
  function commit(){ if (editing<0) return true; const txt = val("hlText");
    if (!txt) { toast("內容不能空白；要移除請按「刪除這筆」"); return false; }
    const d = draft[editing]; if (txt!==d.text || val("hlDate")!==(d.at||"")) { draft[editing] = {...d, at:val("hlDate"), text:txt, edited:true}; dirty = true; }
    editing = -1; render_(); return true; }
  function mount(id){ boxId = id; render_();
    box().addEventListener("click", e=>{ const b = e.target.closest("[data-hl]"); if (!b) return; e.preventDefault();
      const act = b.dataset.hl;
      if (act==="edit") { if (editing>=0 && !commit()) return; editing = +b.dataset.ix; render_(); }
      else if (act==="ok") commit();
      else if (act==="cancel") { editing = -1; render_(); }
      else if (act==="del") { if (b.dataset.confirm) { draft.splice(editing,1); editing = -1; dirty = true; render_(); toast("已移除，按下方按鈕儲存後生效"); }
        else { b.dataset.confirm = "1"; b.textContent = "確定刪除？再按一次"; } } });
    box().addEventListener("keydown", e=>{ if (e.target.id==="hlText" && e.key==="Enter" && (e.ctrlKey||e.metaKey)) { e.preventDefault(); commit(); }
      if (e.key==="Escape" && editing>=0) { e.stopPropagation(); editing=-1; render_(); } }); }
  return { mount, commit, result: () => draft.map(l=>({...l})), dirty: () => dirty };
}
function quickProgress(id){
  const i = DB.issues.find(x=>x.id===id);

  drawer(`${esc(i.id)}　更新對策與進度`, `<span class="tag wrap">${esc(i.title)}</span>
    <div class="f"><label>目前的對策與進度 <span class="help" style="font-weight:500">按 ✎ 可修改或刪除既有內容</span></label><div class="hist editable" id="kHist"></div></div>
    ${fld("kLog",`新增一筆對策／進度（記為 ${md(iso(TODAY))}，選填）`,`<textarea id="kLog" placeholder="例：已提交 v2 版本，待對方簽回" style="min-height:96px"></textarea>`)}

    if (val("kStatus")!==i.status) log.push({at:iso(TODAY), text:`狀態：${i.status} → ${val("kStatus")}`});
    const st = val("kStatus");
    closeForm(); issueSave(i, {log, due:val("kDue"), status: st==="Open" && val("kLog") ? "處理中" : st, closed: st==="已結案" ? (i.closed||iso(TODAY)) : ""}, `已更新 ${i.id} 對策與進度`);
  });
  ed.mount("kHist");
  setTimeout(()=>$("kLog")?.focus(), 60);
}

    const nm = val("uName"), org = val("uOrg");
    if (!nm || !org) return toast("請填寫姓名與所屬公司");
    if (isNew && personOf(nm)) return toast(`「${nm}」已經存在`);
    upsertPerson(nm, {name:nm, orgType:"供應商", org, role:val("uRole"), note:val("uNote")});
    if (isNew && val("uProj")) { const pr = proj(val("uProj")); if (!val("uPS")) return toast("請填寫到崗日，或專案選「先不登記」");
      const ps = val("uPS"); local.assignments["L"+Date.now()] = {id:"L"+Date.now(), person:nm, project:pr.id, country:pr.country, city:pr.city, planStart:ps, planEnd:val("uPE"),
        actualStart: ps<=iso(TODAY)?ps:"", actualEnd:"", duty:"", line:"", status:"確認", updated:iso(TODAY), source:"中控台"}; }
    logChange(isNew?"新增供應商人員":"更新供應商人員", nm, nm); persist(); closeForm(); toast(`${isNew?"已新增":"已更新"}：${org} ${nm}`); render();
  });
  if (!isNew) {
    $("uAddSite").addEventListener("click", ()=>{ const pr = proj(val("uNewProj")); siteReturn = p.name; closeForm(); openForm(null, {site:true, person:p.name, project:pr.id, country:pr.country, city:pr.city}); });
    $("dForm").addEventListener("click", e=>{
      const ed_ = e.target.closest("[data-asg-edit]"), del = e.target.closest("[data-asg-del]");
      if (ed_) { e.preventDefault(); e.stopPropagation(); siteReturn = p.name; closeForm(); openForm(ed_.dataset.asgEdit); }
      if (del) { e.preventDefault(); e.stopPropagation();
        if (!del.dataset.confirm) { del.dataset.confirm = "1"; del.textContent = "確定？再按一次"; return; }
        const a = DB.assignments.find(x=>x.id===del.dataset.asgDel);
        local.assignments[a.id] = Object.assign({}, a, {deleted:true, deletedAt:iso(TODAY)}); logChange("刪除到崗紀錄", a.id, a.person); persist();
        toast(`已刪除 ${p.name} 的到崗紀錄：${proj(a.project).name} ${md(a.actualStart||a.planStart)}`); render(); openSupplier(p.name); } });
    const foot = document.querySelector(".drawer footer");
    foot.insertAdjacentHTML("afterbegin", `<button type="button" class="btn ghost danger" id="delPerson">刪除此人員</button><span style="flex:1"></span>`);
    $("delPerson").addEventListener("click", e=>{ const b = e.currentTarget; const n = asg.length;
      if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = n ? `連同 ${n} 筆到崗紀錄刪除？再按一次` : "確定刪除？再按一次"; b.classList.add("armed"); return; }
      asg.forEach(a=>{ local.assignments[a.id] = Object.assign({}, a, {deleted:true, deletedAt:iso(TODAY)}); });
      local.people[p.name] = Object.assign({}, p, {deleted:true, deletedAt:iso(TODAY)}); logChange("刪除供應商人員", p.name, p.name); persist(); closeForm();
      toast(`已刪除供應商人員：${p.org} ${p.name}${n?`（含 ${n} 筆到崗紀錄）`:""}`); render(); });
  }
}

// ---------- 專案資訊 ----------
function openProj(id){
  const isNew = !id;
  const p = id ? proj(id) : {name:"", country:"", city:"", owner:"", status:"規劃中", start:"", planEnd:"", note:"", milestones:[]};
  const body = `<span class="tag wrap">專案層級資料：課長／經理級以上編輯（正式版會依登入帳號控管）</span>
    ${fld("jName","專案名稱",inp("jName",p.name,'placeholder="例：北非項目"'))}
    <div class="f2">${fld("jCountry","國家",inp("jCountry",p.country))}${fld("jCity","城市",inp("jCity",p.city))}</div>
    <div class="f2">${fld("jOwner","專案負責人",inp("jOwner",p.owner,'list="dlBX"')+dl("dlBX",DB.people.filter(x=>x.orgType==="寶新").map(x=>x.name)))}${fld("jStatus","狀態",sel("jStatus",L.projectStatus,p.status))}</div>
    <div class="f2">${fld("jStart","開始日",inp("jStart",p.start,'type="date"'))}${fld("jEnd","計畫完成",inp("jEnd",p.planEnd,'type="date"'))}</div>
    ${fld("jNote","備註",`<textarea id="jNote">${esc(p.note)}</textarea>`)}`;
  drawer(isNew?"新增專案":"編輯專案資訊", body, isNew?"建立專案":"儲存", ()=>{
    const nm = val("jName"); if (!nm) return toast("請填寫專案名稱");
    if (DB.projects.some(x=>x.name===nm && x.id!==id)) return toast(`已有專案叫「${nm}」`);
    const pid = id || ensureProject(nm);
    local.projects[pid] = Object.assign({}, proj(pid), {name:nm, country:val("jCountry"), city:val("jCity"), owner:val("jOwner"), status:val("jStatus"), start:val("jStart"), planEnd:val("jEnd"), note:val("jNote")});
    logChange(isNew?"新增專案":"更新專案", pid, ""); persist(); closeForm(); toast(`${isNew?"已建立":"已更新"}專案：${nm}`);
    if (isNew) { curProj = pid; location.hash = pid; } render();
  });
}
function openTask(id, preset={}){
  const isNew = !id;
  const t = id ? DB.tasks.find(x=>x.id===id) : Object.assign({project:curProj, section:"", process:"", task:"", planStart:"", planEnd:"", actualStart:"", actualEnd:"", owner:"", status:"未開始", note:""}, preset);
  const secs = [...new Set(DB.tasks.filter(x=>x.project===t.project).map(x=>x.section).filter(Boolean))];
  const body = `<span class="tag wrap">${esc(proj(t.project).name)}</span>
    <div class="f2">${fld("tSec","工段／階段",inp("tSec",t.section,'list="dlSec" placeholder="例：一工段、廠房建設"')+dl("dlSec",secs))}${fld("tProc","工序／項目",inp("tProc",t.process,'placeholder="例：正極合漿"'))}</div>
    <div class="f2">${fld("tTask","任務內容",inp("tTask",t.task,'placeholder="例：設備平台安裝"'))}${fld("tOwner","負責單位",inp("tOwner",t.owner,'list="dlOrg"')+dl("dlOrg",orgNames()))}</div>
    <fieldset class="fs"><legend>預計時程（計畫）</legend><div class="f2">${fld("tPS","預計開始",inp("tPS",t.planStart,'type="date"'))}${fld("tPE","預計完成",inp("tPE",t.planEnd,'type="date"'))}</div></fieldset>
    <fieldset class="fs"><legend>實際時程</legend><div class="f2">${fld("tAS","實際開始",inp("tAS",t.actualStart,'type="date"'))}${fld("tAE","實際結束",inp("tAE",t.actualEnd,'type="date"'),"填寫實際結束即視為完成")}</div></fieldset>
    ${fld("tStatus","狀態",sel("tStatus",L.taskStatus,t.status==="卡關"?"有風險":t.status),"有未結案 Issue 時，甘特圖會自動顯示為「有風險」")}
    ${fld("tNote","說明",`<textarea id="tNote" placeholder="目前進度、卡在哪裡、下一步">${esc(t.note)}</textarea>`)}`;
  drawer(isNew?"新增任務":"編輯任務", body, isNew?"新增任務":"儲存", ()=>{
    if (!val("tProc") && !val("tTask")) return toast("請填寫工序或任務內容");
    const ps=val("tPS"), pe=val("tPE"), as=val("tAS"), ae=val("tAE");
    if (ps && pe && pe<ps) return toast("預計完成早於預計開始，請修正");
    if (as && ae && ae<as) return toast("實際結束早於實際開始，請修正");
    const nid = id || `T${Date.now()}`;
    local.tasks[nid] = Object.assign({}, t, {id:nid, section:val("tSec"), process:val("tProc"), task:val("tTask"), owner:val("tOwner"),
      planStart:ps, planEnd:pe, actualStart:as, actualEnd:ae, status: ae ? "完成" : val("tStatus"), note:val("tNote"), updated:iso(TODAY)});
    logChange(isNew?"新增任務":"更新任務", nid, ""); persist(); closeForm(); toast(`${isNew?"已新增":"已更新"}任務：${val("tProc")} ${val("tTask")}`); render();
  });
}
function openMilestone(pid, ix){
  const p = proj(pid); const list = [...(p.milestones||[])]; const isNew = ix==null; const m = isNew ? {name:"", date:"", note:""} : list[ix];
  const body = `<span class="tag wrap">${esc(p.name)}　項目節點會顯示在安裝任務甘特圖最上方</span>
    <div class="f2">${fld("mName","節點名稱",inp("mName",m.name,'list="dlMs" placeholder="例：KO、PA、TT、SOP"')+dl("dlMs",L.milestone))}${fld("mDate","日期",inp("mDate",m.date,'type="date"'))}</div>
    ${fld("mNote","說明（選填）",inp("mNote",m.note,'placeholder="例：Kick-off 會議"'))}
    ${isNew?"":`<button type="button" class="linkbtn warnbtn" id="mDel">刪除這個節點</button>`}`;
  drawer(isNew?"新增項目節點":"編輯項目節點", body, "儲存", ()=>{
    if (!val("mName") || !val("mDate")) return toast("請填寫節點名稱與日期");
    const rec = {name:val("mName"), date:val("mDate"), note:val("mNote")};
    if (isNew) list.push(rec); else list[ix] = rec;
    list.sort((a,b)=>a.date.localeCompare(b.date));
    local.projects[pid] = Object.assign({}, p, {milestones:list}); persist(); closeForm(); toast(`已儲存節點：${rec.name} ${md(rec.date)}`); render();
  });
  if (!isNew) $("mDel").addEventListener("click", ()=>{ list.splice(ix,1); local.projects[pid] = Object.assign({}, p, {milestones:list}); persist(); closeForm(); toast(`已刪除節點：${m.name}`); render(); });
}

let tt; function toast(t){ let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,3200); }

// ================= 路由 =================
const VIEWS = {overview:viewOverview, dispatch:viewDispatch, projects:viewProject, tracker:viewTracker, people:viewPeople};
function route(){ const h = location.hash.slice(1); if (/^P\d+$/.test(h)) { curProj = h; return "projects"; } if (h==="issues") return "overview"; return VIEWS[h] ? h : "overview"; }
let lastRem = [];
function render(){
  const r = route();
  document.querySelectorAll("#tabs a").forEach(a=>{ if(a.getAttribute("href")!=="#"+r) a.removeAttribute("aria-current"); else a.setAttribute("aria-current","page"); });
  if (r==="overview") lastRem = reminders();
  $("view").innerHTML = VIEWS[r]();
}
$("today").textContent = `${TODAY.getFullYear()}/${TODAY.getMonth()+1}/${TODAY.getDate()}（週${WK[TODAY.getDay()]}）`;
window.addEventListener("hashchange", ()=>{ render(); if (location.hash==="#issues") $("issues")?.scrollIntoView(); else window.scrollTo(0,0); });

// 篩選狀態與「清除篩選」的預設值（年度、狀態分頁、分組等不清除）
const FS = {OV, F, PV, TF, PF};
const FDEF = { OV:{proj:"", q:""}, F:{project:"", unit:"", country:"", status:"", q:""},
  PV:{q:"", iss:"", co:"", role:"", sec:"", health:""}, TF:{owner:"", project:"all", kind:"", sev:"", od:"", q:""} };
document.addEventListener("click", e=>{
  if (e.target.closest(".totop")) return window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  const t = e.target.closest("[data-close],[data-new],[data-edit],[data-leave],[data-issue],[data-new-issue],[data-promote],[data-person],[data-new-person],[data-new-onsite],[data-asg-for],[data-new-unit],[data-unit],[data-fill],[data-psort],[data-porg],[data-pf-clear],[data-tf],[data-quick],[data-close-issue],[data-reopen],[data-goto-tracker],[data-edit-proj],[data-new-proj],[data-new-task],[data-task],[data-raise],[data-new-ms],[data-ms],[data-range],[data-toggle-closed],[data-proj],[data-scroll],[data-fclear]"); if(!t) return;
  const d = t.dataset;
  if (t.hasAttribute("data-close")) return closeForm();
  if (t.hasAttribute("data-new")) return openForm(null);
  if (d.edit) return openForm(d.edit);
  if (d.leave) return markLeft(d.leave);
  if (d.issue) return openIssue(d.issue);
  if (d.newIssue !== undefined) return openIssue(null, d.newIssue ? {project:d.newIssue} : {});
  if (d.promote !== undefined) { const x = lastRem[+d.promote]; return openIssue(null, {project:x.proj, title:x.t, desc:x.d, category:x.cat, severity:x.sev==="crit"?"高":x.sev==="warn"?"中":"低"}); }
  if (d.person !== undefined) return openPerson(d.person);
  if (t.hasAttribute("data-new-person")) return openPerson(null, d.newPerson || "寶新");
  if (t.hasAttribute("data-new-unit")) return openUnit(null);
  if (d.unit) return openUnit(d.unit);
  if (d.fill) { const el = $(d.fill); el.value = d.v; el.focus(); return; }
  if (d.psort) { PF.sort = d.psort; return render(); }
  if (d.porg) { PF.org = d.porg; return render(); }
  if (t.hasAttribute("data-pf-clear")) { Object.assign(PF, {unit:"", st:"在職", co:"", role:"", proj:"", on:"", q:""}); return render(); }
  if (d.fclear) { Object.assign(FS[d.fclear], FDEF[d.fclear]); return render(); }
  if (d.tf !== undefined) { const ix = d.tf.indexOf(":"); TF[d.tf.slice(0,ix)] = d.tf.slice(ix+1); return render(); }
  if (d.quick) return quickProgress(d.quick);
  if (d.closeIssue) return confirmClose(d.closeIssue);
  if (d.reopen) return confirmReopen(d.reopen);
  if (t.hasAttribute("data-goto-tracker")) { TF.project = ""; location.hash = "tracker"; return; }
  if (d.asgFor) { const nm = d.asgFor; closeForm(); return openForm(null, {person:nm}); }
  if (d.newOnsite) { const pr = proj(d.newOnsite); return openForm(null, {project:pr.id, country:pr.country||"美國", city:pr.city||"", site:true}); }
  if (d.editProj) return openProj(d.editProj);
  if (t.hasAttribute("data-new-proj")) return openProj(null);
  if (d.newTask) return openTask(null, {project:d.newTask});
  if (d.task) return openTask(d.task);
  if (d.raise) { const tk = DB.tasks.find(x=>x.id===d.raise); return openIssue(null, {project:tk.project, task:tk.id, category:"進度", severity:"中", party:tk.owner, title:`${tk.process}${tk.task}：`}); }
  if (d.newMs) return openMilestone(d.newMs, null);
  if (d.ms) { const [pid, ix] = d.ms.split("|"); return openMilestone(pid, +ix); }
  if (d.range) { PV.range = d.range; return render(); }
  if (t.hasAttribute("data-toggle-closed")) { PV.closed = !PV.closed; return render(); }
  if (d.scroll) { e.preventDefault(); if (route()!=="overview") location.hash="overview"; setTimeout(()=>$(d.scroll)?.scrollIntoView({behavior:"smooth"}),30); return; }
  if (d.proj) { if (d.proj!==curProj) Object.assign(PV, FDEF.PV); curProj = d.proj; if (location.hash === "#"+d.proj) render(); else location.hash = d.proj; window.scrollTo(0,0); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") { if ($("dlgRoot")) return closeDialog(); closeForm(); } });
document.addEventListener("change", e=>{
  const id = e.target.id;
  if (id==="fYear") F.year = +e.target.value; else if (id==="fOrg") F.org = e.target.value; else if (id==="fProj") F.project = e.target.value;
  else if (id==="peOrg") PF.org = e.target.value;
  else if (id==="pfUnit") PF.unit = e.target.value; else if (id==="pfSt") PF.st = e.target.value;
  else if (id==="pfCo") { PF.co = e.target.value; PF.role = ""; } else if (id==="pfRole") PF.role = e.target.value;
  else if (id==="pfProj") PF.proj = e.target.value; else if (id==="pfOn") PF.on = e.target.value;
  else if (id==="tfProj") TF.project = e.target.value;
  else if (e.target.dataset.fk) { const [o,k] = e.target.dataset.fk.split("."); FS[o][k] = e.target.value; if (o==="PV" && k==="co") PV.role = ""; }
  else if (id==="iPerson") return;
  else if (e.target.dataset.projsel) { const pre = e.target.dataset.projsel; const box = $(pre+"ProjNew"); box.hidden = e.target.value!=="__new"; if (!box.hidden) box.focus(); $("dForm")?.dispatchEvent(new Event("input")); return; }
  else if (id==="pUnit") { document.querySelector(".newunit").hidden = e.target.value!=="__new"; document.querySelector(".extdept").hidden = e.target.value!=="__ext"; if (e.target.value==="__new") $("pUnitNew").focus(); if (e.target.value==="__ext") $("pExt").focus(); return; }
  else if (id==="pCo") { const v = e.target.value; $("pCoNew").hidden = v!=="__new"; if (v==="__new") $("pCoNew").focus();
    const home = v===HOME_CO; $("pUnit").hidden = !home; document.querySelector(".newunit").hidden = !(home && $("pUnit").value==="__new");
    document.querySelector(".extdept").hidden = home && $("pUnit").value!=="__ext"; return; }
  else if (id==="pType") { const bxT = e.target.value==="寶新"; document.querySelectorAll(".bx-only").forEach(x=>x.hidden=!bxT); document.querySelectorAll(".sup-only").forEach(x=>x.hidden=bxT); return; }
  else return;
  render();
});
// 各分頁搜尋框：輸入停頓後才重新整理；中文注音／拼音組字中不觸發，避免打斷輸入法
const QMAP = {ovQ:["OV","q"], fQ:["F","q"], pvQ:["PV","q"], tfQ:["TF","q"], pfQ:["PF","q"]};
let qT, composing = false;
const runSearch = el => { const m = QMAP[el.id]; if (!m) return; clearTimeout(qT); const id = el.id;
  qT = setTimeout(()=>{ const cur = $(id); if (!cur || composing) return; FS[m[0]][m[1]] = cur.value.trim(); render(); const n = $(id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 300); };
document.addEventListener("input", e=>{ if (e.isComposing) return; runSearch(e.target); });
document.addEventListener("compositionstart", ()=>{ composing = true; clearTimeout(qT); });
document.addEventListener("compositionend", e=>{ composing = false; runSearch(e.target); });
const topBtn = document.querySelector(".totop");
window.addEventListener("scroll", ()=>{ topBtn.hidden = window.scrollY < 400; }, {passive:true});
render();
};
window.BX.boot(window.bxStart);
</script>
